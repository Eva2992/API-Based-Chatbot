<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-inter">

  <div class="bg-white shadow-lg rounded-2xl w-full max-w-3xl flex flex-col h-[650px] overflow-hidden">

    
    <!-- Header -->
    <div class="flex items-center justify-between bg-green-600 text-white p-4">

      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
          <path d="M2 14h2"/><path d="M20 14h2"/>
          <path d="M15 13v2"/><path d="M9 13v2"/>
        </svg>
        <h1 class="text-lg font-semibold">Fateema Eva</h1>
      </div>
       
      <button id="clear-chat-button" title="Clear Chat History" class="hover:text-red-200">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 p-4 space-y-4 overflow-y-auto bg-green-50">


      <!-- User message -->
      <div class="flex justify-end">
        <div class="flex items-center gap-2">
          <span class="bg-green-600 text-white px-3 py-2 rounded-lg text-sm">hello</span>

          <div class="w-8 h-8 flex items-center justify-center bg-green-500 text-white rounded-full text-sm font-semibold">U</div>

        </div>
      </div>

      <!-- Bot message -->
      <div class="flex justify-start">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 flex items-center justify-center bg-green-500 text-white rounded-full text-sm font-semibold">G</div>

          <span class="bg-green-100 text-gray-900 px-3 py-2 rounded-lg text-sm">Hello there! How can I help you today?</span>

        </div>
      </div>

    </div>

    <!-- Input Area -->
    <form id="chat-form" class="flex items-center border-t p-3 bg-white">
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off"
        class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400"
 />
        <!-- Send Button -->
        <button type="submit" id="send-button"
  class="ml-3 bg-green-600 hover:bg-green-700 text-white rounded-full p-2 transition">
  <span id="send-icon" class="inline-block w-5 h-5">
    <!-- keep your SVG inside the span -->
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="w-5 h-5">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </span>
</button>

<div id="loading-spinner"
  class="hidden animate-spin ml-3 border-t-2 border-b-2 border-green-600 rounded-full w-5 h-5"></div>


      <div id="loading-spinner" class="hidden animate-spin ml-3 border-t-2 border-b-2 border-green-600 rounded-full w-5 h-5"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
